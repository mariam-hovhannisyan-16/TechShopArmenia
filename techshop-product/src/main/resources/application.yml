spring:
  application:
    name: techshop-product

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/techshop_product
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key-change-in-production}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production}

services:
  wishlist:
    url: ${WISHLIST_SERVICE_URL:http://localhost:8086}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}

server:
  port: ${SERVER_PORT:8084}

logging:
  level:
    am.techshop.product: ${LOG_LEVEL:INFO}