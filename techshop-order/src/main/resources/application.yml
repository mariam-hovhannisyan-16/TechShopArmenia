spring:
  application:
    name: techshop-order

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/techshop_order
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production}

internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key-change-in-production}

payment:
  idram:
    sandbox-mode: ${IDRAM_SANDBOX_MODE:true}
    sandbox-url: ${IDRAM_SANDBOX_URL:https://sandbox.idram.am/payment}
    merchant-id: ${IDRAM_MERCHANT_ID:sandbox-merchant}
    secret-key: ${IDRAM_SECRET_KEY:sandbox-secret}
  telcell:
    sandbox-mode: ${TELCELL_SANDBOX_MODE:true}
    sandbox-url: ${TELCELL_SANDBOX_URL:https://sandbox.telcellwallet.am/payment}
    merchant-id: ${TELCELL_MERCHANT_ID:sandbox-merchant}
    secret-key: ${TELCELL_SECRET_KEY:sandbox-secret}
  roket-line:
    sandbox-mode: ${ROKET_LINE_SANDBOX_MODE:true}
    sandbox-url: ${ROKET_LINE_SANDBOX_URL:https://sandbox.roketline.am/payment}
    merchant-id: ${ROKET_LINE_MERCHANT_ID:sandbox-merchant}
    secret-key: ${ROKET_LINE_SECRET_KEY:sandbox-secret}

server:
  port: ${SERVER_PORT:8083}

services:
  cart:
    url: ${CART_SERVICE_URL:http://localhost:8082}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8084}

logging:
  level:
    am.techshop.order: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}