spring:
  application:
    name: techshop-user

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/techshop_user
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Fail fast instead of blocking the register/login request thread for
        # up to the 60s default while waiting on topic metadata when Kafka is
        # slow or unreachable.
        max.block.ms: 5000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key-change-in-production}
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    am.techshop.user: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}