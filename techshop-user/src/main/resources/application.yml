spring:
  application:
    name: techshop-user

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/techshop_user
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # If true, login is rejected until the user has verified their email.
  # Defaults to false — login is always allowed, and the frontend can use
  # the `emailVerified` flag on the returned user to show a reminder instead.
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    am.techshop.user: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}