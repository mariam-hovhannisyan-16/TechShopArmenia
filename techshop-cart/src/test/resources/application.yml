spring:
  application:
    name: techshop-cart

  datasource:
    url: jdbc:h2:mem:carttest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

services:
  product:
    url: http://localhost:0

app:
  frontend-url: http://localhost:4200
  jwt:
    secret: test-only-integration-secret-not-for-production-use-1234

internal:
  api-key: test-internal-key

server:
  port: 0
