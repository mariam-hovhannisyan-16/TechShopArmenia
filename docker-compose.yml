services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: techshop-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: techshop-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

  postgres:
    image: postgres:16
    container_name: techshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  techshop-user:
    build:
      context: .
      dockerfile: techshop-user/Dockerfile
    container_name: techshop-user
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - kafka

  techshop-product:
    build:
      context: ./techshop-product
      dockerfile: Dockerfile
    container_name: techshop-product
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WISHLIST_SERVICE_URL: http://techshop-wishlist:8086
      USER_SERVICE_URL: http://techshop-user:8081
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - kafka

  techshop-cart:
    build:
      context: ./techshop-cart
      dockerfile: Dockerfile
    container_name: techshop-cart
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PRODUCT_SERVICE_URL: http://techshop-product:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - techshop-product
      - kafka

  techshop-order:
    build:
      context: ./techshop-order
      dockerfile: Dockerfile
    container_name: techshop-order
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CART_SERVICE_URL: http://techshop-cart:8082
      USER_SERVICE_URL: http://techshop-user:8081
      PRODUCT_SERVICE_URL: http://techshop-product:8084
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      IDRAM_SANDBOX_MODE: "true"
      IDRAM_SANDBOX_URL: https://sandbox.idram.am/payment
      IDRAM_MERCHANT_ID: sandbox-merchant
      IDRAM_SECRET_KEY: sandbox-secret
      TELCELL_SANDBOX_MODE: "true"
      TELCELL_SANDBOX_URL: https://sandbox.telcellwallet.am/payment
      TELCELL_MERCHANT_ID: sandbox-merchant
      TELCELL_SECRET_KEY: sandbox-secret
    depends_on:
      - postgres
      - kafka
      - techshop-cart
      - techshop-user
      - techshop-product

  techshop-notification:
    build:
      context: ./techshop-notification
      dockerfile: Dockerfile
    container_name: techshop-notification
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - kafka

  techshop-wishlist:
    build:
      context: ./techshop-wishlist
      dockerfile: Dockerfile
    container_name: techshop-wishlist
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PRODUCT_SERVICE_URL: http://techshop-product:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - techshop-product
      - kafka

  techshop-chat:
    build:
      context: ./techshop-chat
      dockerfile: Dockerfile
    container_name: techshop-chat
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data: