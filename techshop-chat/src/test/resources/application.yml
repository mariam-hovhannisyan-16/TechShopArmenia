spring:
  application:
    name: techshop-chat

  datasource:
    url: jdbc:h2:mem:chattest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 1000

app:
  frontend-url: http://localhost:4200
  jwt:
    secret: test-only-integration-secret-not-for-production-use-1234

server:
  port: 0
